name: eatinpal
description: "EatinPal - Your personal calorie & nutrition tracker"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.7.0

  # Networking
  dio: ^5.7.0

  # Navigation
  go_router: ^14.3.0

  # Functional Programming
  fpdart: ^1.1.0

  # Code Generation (annotations)
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Environment
  flutter_dotenv: ^5.2.1

  # Local Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - .env
